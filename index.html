<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b18;color:#dffaff;
 font-family:Arial,sans-serif;text-align:center;
 min-height:100vh;padding:20px 14px;
}
h1{color:#45dcff;letter-spacing:5px;margin-top:22px}
.sub{color:#7da9bd;font-size:13px}
.core{
 width:175px;height:175px;border-radius:50%;
 margin:30px auto;border:3px solid #21c9ff;
 box-shadow:0 0 25px #008cff, inset 0 0 25px #008cff;
 display:flex;align-items:center;justify-content:center;
 animation:pulse 2s infinite;
}
.core span{font-size:52px;color:#55eaff}
@keyframes pulse{
 50%{box-shadow:0 0 50px #008cff,inset 0 0 40px #008cff}
}
.panel{
 max-width:550px;margin:15px auto;
 border:1px solid #15516c;border-radius:15px;
 background:#0a1728;padding:16px;
}
input,select,button{
 width:100%;padding:13px;margin:6px 0;
 border-radius:9px;border:1px solid #24617a;
 background:#101f32;color:white;font-size:15px;
}
button{background:#087da9;border:0;font-weight:bold}
button:active{opacity:.7}
#mic{border-radius:30px;background:#075d91}
#chat{
 height:230px;overflow:auto;text-align:left;
 font-size:14px;line-height:1.6;
}
.msg{padding:10px;margin:8px 0;border-radius:9px}
.user{background:#103b54}
.bot{background:#172a3c}
.status{color:#43dfff;font-size:13px}
.small{font-size:11px;color:#8caabd}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

<div class="core"><span>◉</span></div>
<div class="status" id="status">SYSTEM ONLINE</div>

<div class="panel">
 <input id="key" type="password"
 placeholder="Paste your Gemini API key">
 <button onclick="saveKey()">CONNECT AI BRAIN</button>

 <select id="lang">
  <option value="auto">Automatic language</option>
  <option value="hi-IN">Hindi</option>
  <option value="en-IN">English (India)</option>
  <option value="en-US">English (US)</option>
  <option value="bn-IN">Bengali</option>
  <option value="ta-IN">Tamil</option>
  <option value="te-IN">Telugu</option>
  <option value="mr-IN">Marathi</option>
  <option value="gu-IN">Gujarati</option>
  <option value="es-ES">Spanish</option>
  <option value="fr-FR">French</option>
 </select>
</div>

<div class="panel">
 <div id="chat">
  <div class="msg bot">
   Hello! I am JARVIS. Your personal AI assistant.
   How may I help you?
  </div>
 </div>
 <input id="question" placeholder="Ask me anything...">
 <button onclick="ask()">SEND MESSAGE</button>
 <button id="mic" onclick="listen()">🎙 TALK TO JARVIS</button>
 <button onclick="stopVoice()">🔇 STOP SPEAKING</button>
 <button onclick="clearChat()">CLEAR CHAT</button>
</div>

<div class="panel">
 <div class="small">QUICK COMMANDS</div>
 <button onclick="shortcut('https://www.google.com')">OPEN GOOGLE</button>
 <button onclick="shortcut('https://www.youtube.com')">OPEN YOUTUBE</button>
 <button onclick="shortcut('https://www.google.com/maps')">OPEN MAPS</button>
</div>

<p class="small">JARVIS AI v1.0 | Personal Assistant</p>

<script>
let history=[];
let API_KEY=sessionStorage.getItem("jarvis_key")||"";
document.getElementById("key").value=API_KEY;

function saveKey(){
 API_KEY=document.getElementById("key").value.trim();
 if(!API_KEY){alert("Enter your API key first");return;}
 sessionStorage.setItem("jarvis_key",API_KEY);
 document.getElementById("status").textContent="AI BRAIN CONNECTED";
 alert("JARVIS connected!");
}

function addMessage(text,type){
 const box=document.getElementById("chat");
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=(type==="user"?"YOU: ":"JARVIS: ")+text;
 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

async function ask(){
 const input=document.getElementById("question");
 const q=input.value.trim();
 if(!q)return;
 if(!API_KEY){alert("Connect your Gemini API key first");return;}
 input.value="";
 addMessage(q,"user");
 document.getElementById("status").textContent="THINKING...";

 history.push({role:"user",parts:[{text:q}]});
 if(history.length>12)history=history.slice(-12);

 try{
  const response=await fetch(
   "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key="+encodeURIComponent(API_KEY),
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
     systemInstruction:{parts:[{text:
      "You are JARVIS, a friendly and intelligent personal assistant. "+
      "Understand and respond in the language used by the user. "+
      "Support Hindi, English and multilingual conversations. "+
      "Be helpful, concise and conversational. "+
      "Never claim to have performed actions you cannot perform."
     }]},
     contents:history,
     generationConfig:{temperature:0.7,maxOutputTokens:700}
    })
   }
  );

  const data=await response.json();
  if(!response.ok)throw new Error(
   data.error?.message||"API request failed"
  );

  const answer=data.candidates?.[0]?.content?.parts
   ?.map(p=>p.text||"").join("")||"No response received.";

  history.push({role:"model",parts:[{text:answer}]});
  addMessage(answer,"bot");
  speak(answer);
  document.getElementById("status").textContent="SYSTEM ONLINE";

 }catch(error){
  history.pop();
  addMessage("Error: "+error.message,"bot");
  document.getElementById("status").textContent="CONNECTION ERROR";
 }
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 const lang=document.getElementById("lang").value;
 u.lang=lang==="auto"?"en-IN":lang;
 u.rate=1;
 speechSynthesis.speak(u);
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  alert("Speech recognition is not supported in this browser. Try Chrome.");
  return;
 }
 const rec=new SR();
 rec.lang=document.getElementById("lang").value==="auto"
  ?"hi-IN":document.getElementById("lang").value;
 rec.interimResults=false;
 rec.onstart=()=>document.getElementById("status").textContent="LISTENING...";
 rec.onresult=(e)=>{
  document.getElementById("question").value=
   e.results[0][0].transcript;
  ask();
 };
 rec.onerror=(e)=>{
  document.getElementById("status").textContent="MIC ERROR: "+e.error;
 };
 rec.onend=()=>{
  if(document.getElementById("status").textContent==="LISTENING...")
   document.getElementById("status").textContent="SYSTEM ONLINE";
 };
 rec.start();
}

function stopVoice(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}

function clearChat(){
 history=[];
 document.getElementById("chat").innerHTML="";
 stopVoice();
}

function shortcut(url){
 window.open(url,"_blank");
}
</script>
</body>
</html>
